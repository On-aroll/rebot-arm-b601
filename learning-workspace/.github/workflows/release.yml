name: Publish Linux Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build and publish versioned installation assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo 'Tag must match VERSION'; exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Release already exists; increment VERSION instead of replacing it'; exit 1
          fi
          if git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null 2>&1; then
            git fetch origin "tag" "$tag"
            [[ "$(git rev-parse "$tag^{commit}")" == "$GITHUB_SHA" ]]
          fi
          python3 scripts/build_bundle.py
          (cd dist && sha256sum -c SHA256SUMS)
          gh release create "$tag" \
            "dist/seeed-lerobot-$version-linux-x86_64.tar.gz" \
            "dist/seeed-lerobot-$version-linux-x86_64.tar.gz.sha256" \
            dist/SHA256SUMS dist/install-release.py \
            --target "$GITHUB_SHA" --title "Seeed LeRobot $tag" --notes-file CHANGELOG.md
